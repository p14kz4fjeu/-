<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>全国项目申报归集平台</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%230f2547'/><text x='50' y='68' font-size='52' text-anchor='middle' fill='%23d4af37' font-family='serif' font-weight='bold'>政</text></svg>">
<link rel="stylesheet" href="https://miaoda.feishu.cn/fonts/css2?family=Noto+Sans+SC:wght@300;400;500;600;700&family=Noto+Serif+SC:wght@600;700;900&display=swap">
<style>
:root{
  --ink-900:#0b1a33;
  --ink-800:#0f2547;
  --ink-700:#1a3560;
  --ink-600:#2a4a7f;
  --gold:#c9a449;
  --gold-light:#e6cd8a;
  --blue:#2563eb;
  --blue-soft:#eff4ff;
  --bg:#f5f7fb;
  --line:#e5e9f2;
  --text:#1f2937;
  --text-sub:#6b7280;
  --ok:#10b981;
  --warn:#f59e0b;
  --danger:#ef4444;
  --shadow:0 1px 3px rgba(15,37,71,.06),0 4px 16px rgba(15,37,71,.06);
  --shadow-lg:0 8px 32px rgba(15,37,71,.12);
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{
  font-family:'Noto Sans SC',-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif;
  background:var(--bg);color:var(--text);font-size:14px;line-height:1.6;
  overflow:hidden;
}
/* ===== 布局 ===== */
.app{display:flex;height:100vh}
.sidebar{
  width:268px;background:linear-gradient(180deg,var(--ink-900) 0%,var(--ink-800) 100%);
  color:#cdd8ea;display:flex;flex-direction:column;flex-shrink:0;
}
.main{flex:1;display:flex;flex-direction:column;min-width:0}
/* ===== 侧边栏 ===== */
.brand{
  padding:22px 22px 18px;border-bottom:1px solid rgba(255,255,255,.08);
}
.brand-title{
  font-family:'Noto Serif SC',serif;font-size:19px;font-weight:700;color:#fff;
  letter-spacing:1px;display:flex;align-items:center;gap:10px;
}
.brand-title .seal{
  width:30px;height:30px;border:1.5px solid var(--gold);border-radius:6px;
  display:flex;align-items:center;justify-content:center;color:var(--gold);
  font-size:15px;font-family:'Noto Serif SC',serif;
}
.brand-sub{font-size:11px;color:#7d8fb0;margin-top:6px;letter-spacing:1.5px}
.nav-search{padding:14px 16px 8px}
.nav-search input{
  width:100%;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);
  border-radius:8px;padding:8px 12px;color:#fff;font-size:13px;outline:none;
}
.nav-search input::placeholder{color:#6b7d9e}
.nav-search input:focus{border-color:var(--gold)}
.nav-tree{flex:1;overflow-y:auto;padding:6px 10px 20px}
.nav-tree::-webkit-scrollbar{width:4px}
.nav-tree::-webkit-scrollbar-thumb{background:rgba(255,255,255,.15);border-radius:2px}
.cat{margin-top:8px}
.cat-title{
  font-size:11px;color:#7d8fb0;letter-spacing:1.5px;padding:10px 12px 6px;
  text-transform:uppercase;font-weight:500;
}
.cat-item{
  display:flex;align-items:center;gap:8px;padding:8px 12px;border-radius:6px;
  cursor:pointer;font-size:13px;color:#cdd8ea;transition:all .15s;
  margin:1px 0;
}
.cat-item:hover{background:rgba(255,255,255,.06);color:#fff}
.cat-item.active{background:rgba(201,164,73,.15);color:var(--gold-light);border-left:2px solid var(--gold)}
.cat-item .dot{width:5px;height:5px;border-radius:50%;background:#5a6f94;flex-shrink:0}
.cat-item.active .dot{background:var(--gold)}
.cat-item .badge{margin-left:auto;font-size:10px;background:rgba(255,255,255,.08);padding:1px 6px;border-radius:8px;color:#9fb0cd}
.sidebar-foot{
  padding:14px 18px;border-top:1px solid rgba(255,255,255,.08);font-size:11px;color:#6b7d9e;
}
.refresh-info{display:flex;align-items:center;gap:6px}
.pulse{width:7px;height:7px;border-radius:50%;background:var(--ok);box-shadow:0 0 0 0 rgba(16,185,129,.6);animation:pulse 2s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(16,185,129,.6)}70%{box-shadow:0 0 0 6px rgba(16,185,129,0)}100%{box-shadow:0 0 0 0 rgba(16,185,129,0)}}
/* ===== 顶栏 ===== */
.topbar{
  height:60px;background:#fff;border-bottom:1px solid var(--line);
  display:flex;align-items:center;padding:0 28px;gap:20px;flex-shrink:0;
}
.crumb{font-size:13px;color:var(--text-sub)}
.crumb b{color:var(--text);font-weight:600}
.topbar-right{margin-left:auto;display:flex;align-items:center;gap:16px}
.top-stat{font-size:12px;color:var(--text-sub)}
.top-stat b{color:var(--ink-800);font-size:16px;font-weight:700;margin-right:3px}
.tabs{display:flex;gap:4px}
.tab{
  padding:7px 16px;border-radius:6px;font-size:13px;cursor:pointer;color:var(--text-sub);
  transition:all .15s;font-weight:500;
}
.tab:hover{background:var(--bg);color:var(--ink-800)}
.tab.active{background:var(--ink-800);color:#fff}
/* ===== 内容区 ===== */
.content{flex:1;overflow-y:auto;padding:24px 28px 40px}
.content::-webkit-scrollbar{width:8px}
.content::-webkit-scrollbar-thumb{background:#d1d8e5;border-radius:4px}
/* ===== 项目头部 ===== */
.proj-head{
  background:#fff;border-radius:12px;box-shadow:var(--shadow);padding:24px 28px;
  margin-bottom:20px;position:relative;overflow:hidden;
}
.proj-head::before{
  content:'';position:absolute;left:0;top:0;bottom:0;width:4px;background:linear-gradient(180deg,var(--gold),var(--ink-700));
}
.proj-cat{font-size:12px;color:var(--gold);letter-spacing:2px;font-weight:500}
.proj-name{font-family:'Noto Serif SC',serif;font-size:24px;font-weight:700;color:var(--ink-900);margin:6px 0 10px}
.proj-desc{color:var(--text-sub);font-size:13px;max-width:820px}
.proj-meta{display:flex;gap:24px;margin-top:16px;flex-wrap:wrap}
.meta-chip{
  display:flex;align-items:center;gap:6px;font-size:12px;color:var(--text-sub);
  background:var(--bg);padding:5px 12px;border-radius:6px;
}
.meta-chip b{color:var(--ink-800);font-weight:600}
/* ===== 卡片 ===== */
.card{
  background:#fff;border-radius:12px;box-shadow:var(--shadow);padding:20px 22px;margin-bottom:16px;
}
.card-title{
  font-size:15px;font-weight:600;color:var(--ink-900);margin-bottom:14px;
  display:flex;align-items:center;gap:8px;
}
.card-title::before{content:'';width:3px;height:14px;background:var(--gold);border-radius:2px}
/* ===== 省份网格 ===== */
.prov-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(360px,1fr));gap:14px}
.prov-card{
  border:1px solid var(--line);border-radius:10px;overflow:hidden;transition:all .2s;
}
.prov-card:hover{border-color:var(--gold);box-shadow:var(--shadow)}
.prov-head{
  padding:12px 16px;background:linear-gradient(90deg,#f8fafc,#fff);
  display:flex;align-items:center;cursor:pointer;user-select:none;
}
.prov-name{font-weight:600;color:var(--ink-800);font-size:14px}
.prov-status{margin-left:auto;font-size:11px;color:var(--ok);display:flex;align-items:center;gap:4px}
.prov-arrow{margin-left:8px;color:var(--text-sub);transition:transform .2s;font-size:11px}
.prov-card.open .prov-arrow{transform:rotate(90deg)}
.prov-body{display:none;border-top:1px solid var(--line)}
.prov-card.open .prov-body{display:block}
.p-item{padding:12px 16px;border-bottom:1px solid #f1f4f9}
.p-item:last-child{border-bottom:none}
.p-label{font-size:11px;color:var(--text-sub);margin-bottom:4px;display:flex;align-items:center;gap:6px}
.p-label .tag{font-size:10px;padding:1px 6px;border-radius:3px;background:var(--blue-soft);color:var(--blue)}
.p-link{
  font-size:13px;color:var(--ink-700);text-decoration:none;display:block;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
}
.p-link:hover{color:var(--blue)}
.p-date{font-size:11px;color:#9ca3af;margin-top:2px}
/* ===== 差异分析表 ===== */
.diff-table{width:100%;border-collapse:collapse;font-size:13px;table-layout:fixed}
.diff-table th{
  background:var(--ink-800);color:#fff;padding:10px 14px;text-align:left;font-weight:500;
  font-size:12px;letter-spacing:1px;
}
.diff-table td{padding:10px 14px;border-bottom:1px solid var(--line);vertical-align:top}
.diff-table tr:hover td{background:#fafbfd}
.diff-table .prov-col{width:110px;font-weight:600;color:var(--ink-800)}
.diff-table .key-col{width:130px;color:var(--text-sub);font-size:12px}
/* ===== 报价计算器 ===== */
.price-layout{display:grid;grid-template-columns:340px 1fr;gap:20px}
.price-form label{display:block;font-size:12px;color:var(--text-sub);margin:12px 0 6px}
.price-form select,.price-form input{
  width:100%;padding:9px 12px;border:1px solid var(--line);border-radius:8px;font-size:13px;
  outline:none;background:#fff;
}
.price-form select:focus,.price-form input:focus{border-color:var(--blue)}
.price-result{
  background:linear-gradient(135deg,var(--ink-900),var(--ink-700));color:#fff;
  border-radius:12px;padding:28px;display:flex;flex-direction:column;justify-content:center;
}
.price-num{font-family:'Noto Serif SC',serif;font-size:44px;font-weight:700;color:var(--gold-light);line-height:1.1}
.price-num small{font-size:16px;color:#9fb0cd;font-weight:400;margin-left:6px}
.price-note{font-size:12px;color:#9fb0cd;margin-top:14px;line-height:1.7}
.price-rule{margin-top:10px;font-size:12px;color:#cdd8ea;padding:10px 12px;background:rgba(255,255,255,.06);border-radius:6px}
/* ===== 笔记 ===== */
.note-area{
  width:100%;min-height:380px;border:1px solid var(--line);border-radius:10px;padding:16px;
  font-size:14px;line-height:1.8;outline:none;resize:vertical;font-family:inherit;
}
.note-area:focus{border-color:var(--gold)}
.note-status{font-size:11px;color:var(--ok);margin-top:8px;display:flex;align-items:center;gap:4px}
/* ===== 仪表盘 ===== */
.stat-row{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:20px}
.stat-card{
  background:#fff;border-radius:12px;padding:20px;box-shadow:var(--shadow);
  border-top:3px solid var(--gold);
}
.stat-card:nth-child(2){border-top-color:var(--blue)}
.stat-card:nth-child(3){border-top-color:var(--ok)}
.stat-card:nth-child(4){border-top-color:var(--warn)}
.stat-num{font-size:30px;font-weight:700;color:var(--ink-900);font-family:'Noto Serif SC',serif}
.stat-label{font-size:12px;color:var(--text-sub);margin-top:4px}
.empty{padding:60px;text-align:center;color:var(--text-sub)}
/* ===== 响应式 ===== */
@media(max-width:1100px){
  .price-layout{grid-template-columns:1fr}
  .prov-grid{grid-template-columns:1fr}
  .stat-row{grid-template-columns:repeat(2,1fr)}
}
@media(max-width:820px){
  .sidebar{width:64px}
  .brand-title span,.brand-sub,.cat-title,.cat-item span:not(.dot),.sidebar-foot{display:none}
  .cat-item{justify-content:center;padding:10px}
  .content{padding:16px}
  .topbar{padding:0 16px;flex-wrap:wrap;height:auto}
}
/* ===== 智能检索结果（嵌入省份卡片） ===== */
.smart-box{padding:12px 16px;border-top:1px solid var(--line);background:#fafbfd}
.smart-loading{font-size:12px;color:var(--text-sub);padding:8px 0;display:flex;align-items:center;gap:6px}
.smart-loading .spin{width:12px;height:12px;border:2px solid var(--line);border-top-color:var(--gold);border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.doc-item{
  display:block;padding:10px 12px;background:#fff;border:1px solid var(--line);border-radius:8px;
  margin-bottom:8px;text-decoration:none;color:var(--ink-800);transition:all .15s;
}
.doc-item:hover{border-color:var(--gold);box-shadow:0 2px 8px rgba(201,164,73,.12)}
.doc-title{font-size:13px;font-weight:600;line-height:1.5}
.doc-meta{font-size:11px;color:var(--text-sub);margin-top:3px}
.doc-point{font-size:12px;color:var(--text-sub);margin-top:6px;line-height:1.6;padding-top:6px;border-top:1px dashed var(--line)}
.search-link{
  display:inline-flex;align-items:center;gap:4px;font-size:12px;color:var(--blue);
  text-decoration:none;padding:5px 10px;background:var(--blue-soft);border-radius:6px;margin:2px 4px 2px 0;
}
.search-link:hover{background:#dbe7ff}
.analysis-box{
  margin-top:10px;padding:10px 12px;background:linear-gradient(135deg,#fdf8ed,#fff);
  border-left:3px solid var(--gold);border-radius:0 8px 8px 0;font-size:12px;line-height:1.8;color:var(--text);
}
.analysis-box b{color:var(--ink-900)}
</style>
</head>
<body>
<div class="app">
  <!-- ===== 侧边栏 ===== -->
  <aside class="sidebar">
    <div class="brand">
      <div class="brand-title"><span class="seal">政</span><span>全国项目申报归集平台</span></div>
      <div class="brand-sub">NATIONAL POLICY INTEGRATION</div>
    </div>
    <div class="nav-search">
      <input id="searchInput" placeholder="搜索项目名录…">
    </div>
    <nav class="nav-tree" id="navTree"></nav>
    <div class="sidebar-foot">
      <div class="refresh-info"><span class="pulse"></span><span>政策库每 2 小时自动同步</span></div>
      <div style="margin-top:6px">最近更新：<span id="lastUpdate">--</span></div>
    </div>
  </aside>
  <!-- ===== 主区 ===== -->
  <div class="main">
    <header class="topbar">
      <div class="crumb" id="crumb">项目归集 / <b>总览</b></div>
      <div class="tabs" id="tabs">
        <div class="tab active" data-tab="overview">概览</div>
        <div class="tab" data-tab="policy">政策归集</div>
        <div class="tab" data-tab="diff">差异分析</div>
        <div class="tab" data-tab="price">报价测算</div>
        <div class="tab" data-tab="note">我的思路</div>
      </div>
      <div class="topbar-right">
        <div class="top-stat"><b id="statProj">0</b>项目</div>
        <div class="top-stat"><b>31</b>省市</div>
      </div>
    </header>
    <main class="content" id="content"></main>
  </div>
</div>
<script>
/* ====== 数据：项目名录（源自报价单附件） ====== */
const PROJECTS = [
  {id:'gzrd', cat:'政府级项目', name:'国家级高新技术企业',
   desc:'国家重点支持的高新技术领域企业认定，有效期三年，企业所得税减按15%征收。',
   price:{type:'tiered', unit:'元/家',
     tiers:[
       {max:700, price:1000, label:'营收 ≤ 700万'},
       {max:1500, price:1300, label:'700万 < 营收 ≤ 1500万'},
       {max:2200, price:1500, label:'1500万 < 营收 ≤ 2200万'},

     ],
     input:{label:'上一年度营业收入（万元）', key:'revenue'},
     note:'不含第三方资质认定、产品技术认证；不含审计报告、专项审计报告。如需代理出具审计，另加150元/家渠道费。'},
   national:{
     portal:{name:'科技部政务服务门户', url:'https://fuwu.most.gov.cn'},
     notice:'《高新技术企业认定管理办法》（国科发火〔2016〕32号）及《工作指引》',
     interpret:'重点评价：核心自主知识产权、研发费用占比、高新收入占比、科技人员占比。'
   },
   diff:{
     '北京':'要求研发费用占比从严，示范区内企业可走绿色通道；知识产权需与主营领域强相关。',
     '上海':'采用无纸化全流程申报，张江重点企业优先推荐；对集成电路、人工智能领域有倾斜。',
     '广东':'珠三角九区实行电子化认定，深圳单独评审；对高企培育入库企业给予配套奖励。',
     '江苏':'实行培育入库+认定两级管理，苏南自主创新示范区政策叠加；研发费用辅助账要求规范。',

     '默认':'按国家统一办法执行，各省在推荐名额、专家评审节奏、奖励金额上略有差异。'
   }
  },
  {id:'zdxjrd', cat:'政府级项目', name:'重点小巨人',

   price:{type:'fixed', price:40000, unit:'元/家', note:'一次性代理服务费，不含审计、查新等第三方费用。'},
   national:{portal:{name:'工信部中小企业局', url:'https://www.miit.gov.cn'},

     interpret:'需已入选专精特新小巨人，主导产品细分市场占有率全国前10%，深耕细分领域3年以上。'},
   diff:{'默认':'国家级统一评审，各省负责推荐；北京、上海、广东推荐名额最多。'}
  },
  {id:'zjtxjr', cat:'政府级项目', name:'专精特新小巨人',
   desc:'工信部认定，专精特新中小企业中的佼佼者，聚焦细分市场、创新能力强、成长性好。',
   price:{type:'fixed', price:10000, unit:'元/家', note:'不含审计、查新、检测等第三方费用。'},
   national:{portal:{name:'工信部中小企业局', url:'https://www.miit.gov.cn'},

   diff:{'默认':'国家级认定，有效期3年；各省培育库入库是前置条件。'}
  },
  {id:'zjtx', cat:'政府级项目', name:'专精特新技术企业',

   price:{type:'tiered', unit:'元/家',
     tiers:[
       {max:1600, price:800, label:'营收 ≤ 1600万'},

       {max:2500, price:1200, label:'1900万 < 营收 ≤ 2500万'},

     ],
     input:{label:'上一年度营业收入（万元）', key:'revenue'},

   national:{portal:{name:'各省工信厅', url:'https://www.miit.gov.cn'},
     notice:'《优质中小企业梯度培育管理暂行办法》省级实施细则',

   diff:{'江苏':'培育库入库即享补贴；浙江对专精特新给予20-50万奖励；广东分珠三角、粤东西北差异化名额。'}
  },
  {id:'cxxzx', cat:'政府级项目', name:'创新型中小技术企业',

   price:{type:'choice', unit:'元/家', choices:[
     {key:'direct', label:'直通车（符合直接评价条件）', price:500},
     {key:'normal', label:'非直通车（需评分达标）', price:600}

const PROV_ALIASES = ['北京','天津','河北','山西','内蒙古','辽宁','吉林','黑龙江','上海','江苏','浙江','安徽','福建','江西','山东','河南','湖北','湖南','广东','广西','海南','重庆','四川','贵州','云南','西藏','陕西','甘肃','青海','宁夏','新疆','深圳','青岛','宁波','厦门','大连'];
function detectProvince(title){
  for (const p of PROV_ALIASES){
    if (title.includes(p)) return p;
  }
  return null;
}
/* 获取某项目某省的所有政策（含标题智能识别归属） */
function getPoliciesFor(pid, prov){
  return livePolicies.policies.filter(x=>{
    if (x.project !== pid) return false;
    // 如果标题里明确写了省份，按标题归属
    const detected = detectProvince(x.title);
    if (detected) return detected === prov;
    // 否则按数据里的province字段
    return x.province === prov || x.province === '全国';
  });
}

function govSearchUrl(kw){ return 'https://sousuo.www.gov.cn/sousuo/search.shtml?searchWord='+encodeURIComponent(kw); }
/* ====== 初始化 ====== */
function init(){
  renderNav();
  $('#statProj').textContent = PROJECTS.length;
  // 加载爬虫抓取的最新政策
  fetch('policies.json?_t='+Date.now())
    .then(r=>r.json())
    .then(data=>{
      livePolicies = data;
      $('#lastUpdate').textContent = data.last_updated || '首次运行中';
      render(); // 数据加载后重新渲染
    })
    .catch(()=>{
      $('#lastUpdate').textContent = '等待首次抓取';
    });
  // 默认选第一个项目
  selectProject(PROJECTS[0].id);
  // 搜索
  $('#searchInput').addEventListener('input', e=>renderNav(e.target.value));
  // tab
  document.querySelectorAll('.tab').forEach(t=>{
    t.addEventListener('click', ()=>{
      document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));
      t.classList.add('active');
      state.tab = t.dataset.tab;
      render();
    });
  });
  // 笔记自动保存
  setTimeout(()=>{
    const n = $('#noteArea');
    if(n) n.addEventListener('input', ()=>{
      localStorage.setItem('note_'+state.current.id, n.value);
      $('#noteStatus').textContent = '已自动保存 '+new Date().toLocaleTimeString('zh-CN',{hour12:false});
    });
  },100);
}
/* ====== 侧边栏 ====== */
function renderNav(kw=''){
  const cats = {};
  PROJECTS.forEach(p=>{ (cats[p.cat]=cats[p.cat]||[]).push(p); });
  const tree = $('#navTree'); tree.innerHTML='';
  Object.keys(cats).forEach(cat=>{
    const wrap = document.createElement('div'); wrap.className='cat';
    wrap.innerHTML = `<div class="cat-title">${cat}</div>`;
    cats[cat].filter(p=>!kw||p.name.includes(kw)).forEach(p=>{
      const item = document.createElement('div');
      item.className = 'cat-item'+(state.current&&state.current.id===p.id?' active':'');
      item.innerHTML = `<span class="dot"></span><span>${p.name}</span>`;
      item.addEventListener('click', ()=>selectProject(p.id));
      wrap.appendChild(item);
    });
    tree.appendChild(wrap);
  });
}
function selectProject(id){
  state.current = PROJECTS.find(p=>p.id===id);
  state.detailProv = null;
  renderNav($('#searchInput').value);
  render();
}
function switchPolicyPage(pid, prov, page){
  if (!state.policyPages) state.policyPages = {};
  state.policyPages[pid+'_'+prov] = page;
  render();
}
/* ====== 渲染主区 ====== */
function render(){
  const p = state.current;
  $('#crumb').innerHTML = `项目归集 / <b>${p.name}</b>`;
  const c = $('#content');
  let html = projHead(p);
  if(state.tab==='overview') html += overviewHtml(p);
  else if(state.tab==='policy') html += policyHtml(p);
  else if(state.tab==='diff') html += diffHtml(p);
  else if(state.tab==='price') html += priceHtml(p);
  else if(state.tab==='note') html += noteHtml(p);
  c.innerHTML = html;
  bindAfterRender(p);
}
function projHead(p){
  const bjTag = p.scope==='beijing' ? '<span class="bj-only-tag">仅北京地区可申报</span>' : '';
  return `<div class="proj-head">
    <div class="proj-cat">${p.cat}${bjTag}</div>

    <div class="proj-desc">${p.desc}</div>

      <div class="meta-chip">主管部门：<b>${p.national.portal.name}</b></div>

}

/* ====== 政策详情列表（每页22条） ====== */
function policyDetailHtml(p, prov){
  const fresh = getPoliciesFor(p.id, prov);
  const PAGE_SIZE = 22;
  const totalPages = Math.ceil(fresh.length / PAGE_SIZE) || 1;
  const pageKey = p.id + '_' + prov;
  if (!state.policyPages) state.policyPages = {};
  let curPage = state.policyPages[pageKey] || 1;
  if (curPage > totalPages) curPage = totalPages;
  const pageItems = fresh.slice((curPage-1)*PAGE_SIZE, curPage*PAGE_SIZE);
  const listHtml = pageItems.map(x=>`
    <a class="doc-item" href="${x.url}" target="_blank" style="border-left:3px solid var(--ok);display:block;margin-bottom:10px">
      <div class="doc-title">${x.title} ↗</div>
      <div class="doc-point">${x.date?('发布：'+x.date+' · '):''}来源：${x.source}${x.found_at?(' · 抓取于'+x.found_at):''}</div>
    </a>`).join('');
  const pager = totalPages > 1 ? `<div style="display:flex;justify-content:center;gap:10px;margin-top:20px;align-items:center;flex-wrap:wrap">
    ${curPage>1?`<button onclick="switchPolicyPage('${p.id}','${prov}',${curPage-1})" style="padding:6px 16px;border:1px solid var(--line);border-radius:6px;background:var(--bg);cursor:pointer;font-size:13px">上一页</button>`:'<span style="font-size:13px;color:var(--text-sub)">上一页</span>'}
    <span style="font-size:13px;color:var(--text-sub)">第 ${curPage} / ${totalPages} 页 · 共 ${fresh.length} 条</span>
    ${curPage<totalPages?`<button onclick="switchPolicyPage('${p.id}','${prov}',${curPage+1})" style="padding:6px 16px;border:1px solid var(--line);border-radius:6px;background:var(--bg);cursor:pointer;font-size:13px">下一页</button>`:'<span style="font-size:13px;color:var(--text-sub)">下一页</span>'}
    <span style="font-size:13px;color:var(--text-sub)">跳至</span>
    <input id="pageJump_${p.id}_${prov}" type="number" min="1" max="${totalPages}" value="${curPage}" style="width:50px;padding:4px 6px;border:1px solid var(--line);border-radius:4px;font-size:13px;text-align:center">
    <button onclick="jumpToPage('${p.id}','${prov}')" style="padding:6px 12px;border:1px solid var(--line);border-radius:6px;background:var(--bg);cursor:pointer;font-size:13px">GO</button>
  </div>` : `<div style="text-align:center;margin-top:16px;font-size:12px;color:var(--text-sub)">共 ${fresh.length} 条政策</div>`;
  return `<div class="card">
    <div style="display:flex;align-items:center;gap:12px;margin-bottom:16px">
      <button onclick="closePolicyDetail()" style="padding:6px 14px;border:1px solid var(--line);border-radius:6px;background:var(--bg);cursor:pointer;font-size:13px">← 返回省份列表</button>
      <div style="font-size:18px;font-weight:700">${p.name} · ${prov}政策列表</div>
    </div>
    <div style="font-size:12px;color:var(--text-sub);margin-bottom:16px">数据更新：${livePolicies.last_updated||'加载中'} · 共检索到 ${fresh.length} 条相关政策</div>
    ${listHtml || '<div style="padding:40px;text-align:center;color:var(--text-sub)">暂无相关政策</div>'}
    ${pager}
  </div>`;
}

        <div class="price-note">${pr.note||''}</div>
      </div>

function noteHtml(p){
  const saved = localStorage.getItem('note_'+p.id)||'';
  return `<div class="card"><div class="card-title">${p.name} · 我的工作思路与经验</div>
    <div style="font-size:12px;color:var(--text-sub);margin-bottom:10px">
      在此记录该项目的客户沟通要点、申报踩坑、成功案例、关键人脉等。内容仅保存在本机浏览器，自动保存。
    </div>
    <textarea class="note-area" id="noteArea" placeholder="例如：&#10;1. 北京客户研发费用占比容易卡线，提前3个月帮企业调账；&#10;2. 中关村高新与国家高新可同期申报，注意知识产权不重复使用；&#10;3. …">${saved.replace(/</g,'&lt;')}</textarea>
    <div class="note-status" id="noteStatus">输入即自动保存</div>
  </div>`;
}
/* ====== 渲染后绑定 ====== */
function bindAfterRender(p){
  if(state.tab==='price'){
    const pr = p.price;
    const out = $('#priceOut');
    function show(v){ out.innerHTML = (v==null?'--':v.toLocaleString())+'<small>元</small>'; }
    if(pr.type==='fixed') show(pr.price);
    else if(pr.type==='choice'){
      show(parseInt($('#priceChoice').value));
      $('#priceChoice').addEventListener('change',e=>show(parseInt(e.target.value)));
    } else if(pr.type==='tiered'){
      $('#priceInput').addEventListener('input',e=>{
        const v = parseFloat(e.target.value)||0;
        const tier = pr.tiers.find(t=>v<=t.max);
        show(tier?tier.price:null);
      });
    }
  }
}
init();
</script><!--APP_BODY-->
